# Brox reference-board-specific Kconfig settings.
CONFIG_BOARD_ITE_AIC=y

CONFIG_PLATFORM_EC_I2C=y
CONFIG_I2C=y
CONFIG_I2C_TARGET=y
CONFIG_I2C_EEPROM_TARGET=y
CONFIG_I2C_TARGET_ALLOW_POWER_SAVING=y
CONFIG_PM=y

# Battery
CONFIG_PLATFORM_EC_BATTERY_REPLACE_NULLS=n
