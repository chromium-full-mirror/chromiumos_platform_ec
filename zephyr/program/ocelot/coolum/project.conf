# coolum board-specific Kconfig settings.

CONFIG_BOARD_COOLUM=y

# Bring up configs
CONFIG_PLATFORM_EC_SYSTEM_UNLOCKED=y

# Battery
CONFIG_PLATFORM_EC_BATTERY_REPLACE_NULLS=n

# Volume buttons
CONFIG_PLATFORM_EC_VOLUME_BUTTONS=n

# USB PD
CONFIG_PDC_RUNTIME_PORT_CONFIG=n
CONFIG_USBC_PDC_RTS54XX_CONSOLE_FW_UPDATER=y
CONFIG_USBC_PDC_TPS6699X_CONSOLE_FW_UPDATER=n

# RVP specific power limits.  These are higher than typical Chromebooks
# so check before copying these values to new variants.
CONFIG_PLATFORM_EC_USB_PD_MAX_VOLTAGE_MV=20000
CONFIG_PLATFORM_EC_USB_PD_MAX_POWER_MW=100000
CONFIG_PLATFORM_EC_USB_PD_MAX_CURRENT_MA=5000

# EC software sync
CONFIG_PLATFORM_EC_VBOOT_EFS2=y

# DSP configs
CONFIG_I2C_TARGET=y
CONFIG_PLATFORM_EC_DSP_SERVICE=y
CONFIG_PLATFORM_EC_DSP_INIT_PRIORITY=80
CONFIG_PLATFORM_EC_DSP_RESPONSE_BUFFER_SIZE=128

CONFIG_PLATFORM_EC_LID_ANGLE=n
CONFIG_PLATFORM_EC_LID_ANGLE_UPDATE=n

# Enable accessing IMVP
CONFIG_IMVP_RT3645_CONSOLE=y
CONFIG_IMVP_FACTORY_UPDATE=n
