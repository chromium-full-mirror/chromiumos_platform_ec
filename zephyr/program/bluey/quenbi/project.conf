# quenbi board-specific Kconfig settings.

CONFIG_BOARD_QUENBI=y

# Fan
CONFIG_PLATFORM_EC_NUM_FANS=2
CONFIG_PLATFORM_EC_CUSTOM_FAN_DUTY_CONTROL=y

# Keyboard
CONFIG_INPUT=y
CONFIG_INPUT_SHELL=y
CONFIG_INPUT_EVENT_DUMP=y
CONFIG_INPUT_SHELL_KBD_MATRIX_STATE=y
CONFIG_CROS_EC_KEYBOARD_INPUT=y
CONFIG_PLATFORM_EC_KEYBOARD_PROTOCOL_MKBP=y
CONFIG_PLATFORM_EC_KEYBOARD_COLS=18
CONFIG_CROS_EC_GHOST_FILTER=y
CONFIG_PLATFORM_EC_KBLIGHT_HOOK_INIT=y

# CBI
CONFIG_PLATFORM_EC_BOARD_VERSION_CBI=y

# Battery
CONFIG_PLATFORM_EC_BATTERY_REPLACE_NULLS=n

# Disable Hibernate since exit is unreliable b/489415249
CONFIG_PLATFORM_EC_HIBERNATE=n
