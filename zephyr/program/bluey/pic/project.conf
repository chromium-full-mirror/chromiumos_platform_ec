# pic board-specific Kconfig settings.

CONFIG_BOARD_PIC=y

# Fan
CONFIG_PLATFORM_EC_NUM_FANS=1
CONFIG_PLATFORM_EC_CUSTOM_FAN_DUTY_CONTROL=y
CONFIG_PLATFORM_EC_CUSTOM_FAN_CONTROL=y

# Keyboard
CONFIG_PLATFORM_EC_KEYBOARD_STRICT_DEBOUNCE=y
CONFIG_PLATFORM_EC_KBLIGHT_ENABLE_PIN=y
CONFIG_INPUT_KBD_ACTUAL_KEY_MASK_DYNAMIC=y

# Clock
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=25000000

# Uart
CONFIG_UART_NPCX_USE_MDMA=y

# External Power
CONFIG_PLATFORM_EC_EXTPOWER_GPIO_CUSTOM=y

# Throttling
CONFIG_PLATFORM_EC_THROTTLE_AP=y
CONFIG_PLATFORM_EC_POWERSEQ_CPU_PROCHOT_ACTIVE_LOW=n

# Thermal
CONFIG_PLATFORM_EC_TEMP_SENSOR=y

# CBI configuration
CONFIG_PLATFORM_EC_BOARD_VERSION_CBI=y

# Battery
CONFIG_PLATFORM_EC_BATTERY_REPLACE_NULLS=n
