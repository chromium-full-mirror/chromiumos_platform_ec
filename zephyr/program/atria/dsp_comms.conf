CONFIG_CPP=y
CONFIG_STD_CPP20=y # coreboot g++ __cplusplus 201703L
CONFIG_REQUIRES_FULL_LIBCPP=y

CONFIG_NANOPB=y

# Pigweed
CONFIG_PIGWEED_ASSERT_ZEPHYR=y
CONFIG_PIGWEED_CHRONO_SYSTEM_CLOCK=y
CONFIG_PIGWEED_SYNC_MUTEX=y

CONFIG_COMMON_LIBC_MALLOC=n

# Common features for service and client
CONFIG_PLATFORM_EC_DSP_REMOTE_LID_ANGLE=y
CONFIG_PLATFORM_EC_DSP_REMOTE_LID_SWITCH=y
CONFIG_PLATFORM_EC_DSP_REMOTE_TABLET_SWITCH=y

# CBI is handled locally on RTK, not via DSP comms
CONFIG_PLATFORM_EC_DSP_REMOTE_CBI=n
