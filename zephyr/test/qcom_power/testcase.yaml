common:
  platform_allow:
  - native_sim
tests:
  qcom_power.default: {}
  qcom_power.power_gpio_keys:
    extra_configs:
    - CONFIG_PLATFORM_EC_POWER_BUTTON=n
    extra_dtc_overlay_files:
    - ./boards/native_sim.overlay
    - ./boards/power_button.dtsi
  qcom_power.power_gpio_keys_ro:
    extra_configs:
    - CONFIG_CROS_EC_RO=y
    - CONFIG_PLATFORM_EC_POWER_BUTTON=n
    extra_dtc_overlay_files:
    - ./boards/native_sim.overlay
    - ./boards/power_button.dtsi
  qcom_power.power_gpio_keys_rw:
    extra_configs:
    - CONFIG_CROS_EC_RW=y
    - CONFIG_PLATFORM_EC_POWER_BUTTON=n
    extra_dtc_overlay_files:
    - ./boards/native_sim.overlay
    - ./boards/power_button.dtsi
