common:
  platform_allow:
  - native_sim
tests:
  rauru.usbc:
    extra_configs:
      - CONFIG_TEST_RAURU_USBC=y
      - CONFIG_SHIMMED_TASKS=y
    extra_dtc_overlay_files:
    - common.dtsi
  rauru.hylia:
    extra_configs:
      - CONFIG_TEST_RAURU_HYLIA=y
      - CONFIG_PLATFORM_EC_USB_PD_ALT_MODE_DFP=n
      - CONFIG_PLATFORM_EC_USB_PD_DP_MODE=n
      - CONFIG_PLATFORM_EC_USB_MUX_TASK=n
      - CONFIG_SHIMMED_TASKS=y
    extra_dtc_overlay_files:
    - common.dtsi
