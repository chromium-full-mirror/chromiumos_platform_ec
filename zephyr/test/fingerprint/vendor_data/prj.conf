CONFIG_TEST=y
CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ASSERT=y
CONFIG_EMUL=y
CONFIG_GPIO=y
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Platform EC support
CONFIG_PLATFORM_EC=y
CONFIG_CROS_EC=y
CONFIG_CROS_EC_FIRMWARE_LOAD_OFF=0x0
CONFIG_CROS_EC_RO=y
CONFIG_PLATFORM_EC_BACKLIGHT_LID=n
CONFIG_PLATFORM_EC_SWITCH=n
CONFIG_PLATFORM_EC_CONSOLE_CMD_CHARGEN=n
CONFIG_PLATFORM_EC_PANIC=n

# Flash simulator backs the vendor data partition
CONFIG_FLASH=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_EMUL_CROS_FLASH=y
CONFIG_PLATFORM_EC_FLASH_SIZE_BYTES=0x200000

# Code under test. Not enabled by default here, because the test does not
# enable PLATFORM_EC_FINGERPRINT.
CONFIG_PLATFORM_EC_FP_VENDOR_DATA=y
