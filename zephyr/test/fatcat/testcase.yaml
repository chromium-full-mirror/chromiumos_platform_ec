common:
  platform_allow:
    - native_sim
tests:
  # Lapis project tests
  fatcat.lapis:
    extra_configs:
      - CONFIG_TEST_PROJECT_LAPIS=y

  fatcat.lapis.battery:
    extra_dtc_overlay_files:
      - boards/lapis/battery.dtsi
    extra_configs:
      - CONFIG_TEST_PROJECT_LAPIS=y
      - CONFIG_TEST_PROJECT_BATTERY=y
      - CONFIG_PLATFORM_EC_HOOKS=y
      - CONFIG_PLATFORM_EC_BBRAM_TYPE_BBRAM=y
