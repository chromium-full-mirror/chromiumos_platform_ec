common:
  platform_allow:
    - native_sim
tests:
  ocelot.rvp_board_id:
    extra_configs:
      - CONFIG_TEST_OCELOT_RVP_BOARD_ID=y
  ocelot.blanc_board:
    extra_configs:
      - CONFIG_TEST_OCELOT_BLANC_BOARD=y
      - CONFIG_ADC=y
      - CONFIG_GPIO=y
      - CONFIG_GPIO_EMUL=y
      - CONFIG_I2C=y
      - CONFIG_I2C_EMUL=y
      - CONFIG_PLATFORM_EC_HOOKS=y
      - CONFIG_PWM=y
      - CONFIG_TEST_DISABLE_INLINE_CHIPSET_IN_STATE=y
    extra_dtc_overlay_files:
      - boards/blanc_board.overlay
      - boards/blanc_fan.overlay
