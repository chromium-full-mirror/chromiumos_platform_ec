common:
  platform_allow:
  - native_sim
tests:
  # The UART API provides both interrupt driven and modes.
  console.output.interrupt:
    extra_conf_files:
    - console_output.conf
    extra_dtc_overlay_files:
    - boards/native_sim.overlay
    - console_output.dts
    extra_configs:
    - CONFIG_TEST_CONSOLE_OUTPUT=y
    - CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y
    - CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=n
  console.output.interrupt.noisr:
    extra_conf_files:
    - console_output.conf
    extra_dtc_overlay_files:
    - boards/native_sim.overlay
    - console_output.dts
    extra_configs:
    - CONFIG_TEST_CONSOLE_OUTPUT=y
    - CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y
    - CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=n
    - CONFIG_PLATFORM_EC_ISR_CONSOLE_OUTPUT=n
  console.output.polling:
    extra_conf_files:
    - console_output.conf
    extra_dtc_overlay_files:
    - boards/native_sim.overlay
    - console_output.dts
    extra_configs:
    - CONFIG_TEST_CONSOLE_OUTPUT=y
    - CONFIG_UART_ASYNC_API=y
    - CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=n
    - CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=y
  console.output.polling.noisr:
    extra_conf_files:
    - console_output.conf
    extra_dtc_overlay_files:
    - boards/native_sim.overlay
    - console_output.dts
    extra_configs:
    - CONFIG_TEST_CONSOLE_OUTPUT=y
    - CONFIG_UART_ASYNC_API=y
    - CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=n
    - CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=y
    - CONFIG_PLATFORM_EC_ISR_CONSOLE_OUTPUT=n
  console.restricted:
    extra_configs:
    - CONFIG_TEST_CONSOLE_RESTRICTED=y
    - CONFIG_BOARD_FINGERPRINT=y
  console.output.start_shell_task:
    extra_conf_files:
    - console_output.conf
    extra_dtc_overlay_files:
    - boards/native_sim.overlay
    - console_output.dts
    extra_configs:
    - CONFIG_TEST_CONSOLE_OUTPUT=y
    - CONFIG_SHELL_BACKEND_SERIAL_API_INTERRUPT_DRIVEN=y
    - CONFIG_SHELL_BACKEND_SERIAL_API_POLLING=n
    - CONFIG_PLATFORM_EC_CONSOLE_START_SHELL_TASK=y
  console.pw_log_tokenized:
    extra_configs:
    - CONFIG_TEST_PW_LOG_TOKENIZED=y
    - CONFIG_PIGWEED_LOG_TOKENIZED_LIB=y
    - CONFIG_CPP=y
    - CONFIG_STD_CPP20=y
    - CONFIG_REQUIRES_FULL_LIBCPP=y
    - CONFIG_PLATFORM_EC_HOSTCMD_CONSOLE_DROPPED_LOGS=y
    - CONFIG_PLATFORM_EC_HOSTCMD_CONSOLE=y
    - CONFIG_PLATFORM_EC_PANIC_LOG=y
    - CONFIG_ZTEST_FATAL_HOOK=y
    - CONFIG_CLEANUP_INTERMEDIATE_FILES=n