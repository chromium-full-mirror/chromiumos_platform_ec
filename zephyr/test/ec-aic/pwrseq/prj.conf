CONFIG_PLATFORM_EC=y
CONFIG_CROS_EC=y
CONFIG_CROS_EC_RO=y
CONFIG_SYSCON=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Power sequencing with driver
CONFIG_AP=y
CONFIG_AP_PWRSEQ=y
CONFIG_AP_PWRSEQ_DRIVER=y
CONFIG_AP_X86_INTEL_MTL=y
CONFIG_X86_NON_DSX_PWRSEQ_MTL=y
CONFIG_X86_NON_DSX_PWRSEQ_CONSOLE=y
CONFIG_AP_PWRSEQ_S0IX=n
CONFIG_AP_PWRSEQ_STACK_SIZE=2048

# Pure GPIO, disable eSPI virtual wires
CONFIG_PLATFORM_EC_HOST_INTERFACE_ESPI_VW_SLP_S3=n
CONFIG_PLATFORM_EC_HOST_INTERFACE_ESPI_VW_SLP_S4=n
CONFIG_PLATFORM_EC_HOST_INTERFACE_ESPI_VW_SLP_S5=n

# Power button support
CONFIG_PLATFORM_EC_POWER_BUTTON=y
CONFIG_PLATFORM_EC_POWER_BUTTON_X86=y
CONFIG_PLATFORM_EC_EXTPOWER=n
CONFIG_PLATFORM_EC_EXTPOWER_GPIO=n

# Unlocked system for testing
CONFIG_PLATFORM_EC_SYSTEM_UNLOCKED=y

# Disable features not needed for this test
CONFIG_PLATFORM_EC_VBOOT_EFS2=n
CONFIG_PLATFORM_EC_SWITCH=n
CONFIG_PLATFORM_EC_I2C=n
CONFIG_NAMED_ADC_CHANNELS=n
CONFIG_PLATFORM_EC_BACKLIGHT_LID=n
CONFIG_PLATFORM_EC_KEYBOARD=n
CONFIG_PLATFORM_EC_SHA256_HW_ACCELERATE=n
CONFIG_PLATFORM_EC_VBOOT_HASH=n
CONFIG_EC_HOST_CMD=n
CONFIG_PLATFORM_EC_FAN=n
CONFIG_PLATFORM_EC_HIBERNATE=n
