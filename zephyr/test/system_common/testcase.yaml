common:
  platform_allow:
    - native_sim
tests:
  system.default:
    extra_configs:
      - CONFIG_SHELL_BACKEND_DUMMY=y
      - CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=1000
      - CONFIG_SHELL_BACKEND_SERIAL=n
    tags:
      - common
      - system
  system.cortex_m_mpu:
    extra_configs:
      - CONFIG_SHELL_BACKEND_DUMMY=y
      - CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=1000
      - CONFIG_SHELL_BACKEND_SERIAL=n
      - CONFIG_TEST_CORTEX_M_MPU=y
      - CONFIG_FLASH_BASE_ADDRESS=0x10058000
      - CONFIG_FLASH_SIZE=512
      - CONFIG_SRAM_BASE_ADDRESS=0x200c0000
      - CONFIG_SRAM_SIZE=64
    tags:
      - common
      - system
