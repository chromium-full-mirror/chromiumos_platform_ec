common:
  platform_allow:
    - native_sim
tests:
  bluey.baseboard:
    extra_configs:
      - CONFIG_TEST_BOARD_BASEBOARD=y
      - CONFIG_TEST_BOARD_BASEBOARD_BATTERY=y
      - CONFIG_TEST_BOARD_BASEBOARD_SWITCHCAP=y
      - CONFIG_TEST_BOARD_BASEBOARD_CHIPSET=y
      - CONFIG_TEST_BOARD_BASEBOARD_THROTTLE=y
    extra_dtc_overlay_files:
      - "boards/native_sim.overlay"
  bluey.bluey:
    extra_configs:
      - CONFIG_TEST_BOARD_BLUEY=y
      - CONFIG_TEST_BOARD_BLUEY_CHIPSET=y
      - CONFIG_TEST_BOARD_BLUEY_FAN=y
    extra_dtc_overlay_files:
      - "boards/bluey.overlay"
  bluey.quenbi:
    extra_configs:
      - CONFIG_TEST_BOARD_QUENBI=y
      - CONFIG_TEST_BOARD_QUENBI_CHIPSET=y
      - CONFIG_TEST_BOARD_QUENBI_FAN=y
    extra_dtc_overlay_files:
      - "boards/quenbi.overlay"
  bluey.mica:
    extra_configs:
      - CONFIG_TEST_BOARD_MICA=y
      - CONFIG_TEST_BOARD_MICA_CHIPSET=y
      - CONFIG_TEST_BOARD_MICA_EXTPOWER=y
      - CONFIG_TEST_BOARD_MICA_FAN=y
      - CONFIG_TEST_BOARD_MICA_KEYBOARD=y
      - CONFIG_TEST_BOARD_MICA_LED=y
      - CONFIG_TEST_BOARD_MICA_THROTTLE=y
      - CONFIG_PLATFORM_EC_TEMP_SENSOR=y
    extra_dtc_overlay_files:
      - "boards/mica.overlay"
  bluey.quartz:
    extra_configs:
      - CONFIG_TEST_BOARD_QUARTZ=y
      - CONFIG_TEST_BOARD_QUARTZ_CHIPSET=y
      - CONFIG_TEST_BOARD_QUARTZ_EXTPOWER=y
      - CONFIG_TEST_BOARD_QUARTZ_FAN=y
      - CONFIG_TEST_BOARD_QUARTZ_LED=y
      - CONFIG_PLATFORM_EC_TEMP_SENSOR=y
    extra_dtc_overlay_files:
      - "boards/quartz.overlay"
