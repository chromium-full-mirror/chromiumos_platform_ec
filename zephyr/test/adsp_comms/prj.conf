CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ZTEST_MOCKING=y
CONFIG_TEST=y
CONFIG_ASSERT=y

CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
CONFIG_TASKS_SET_TEST_RUNNER_TID_RULE=y

CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SERIAL=y

CONFIG_PLATFORM_EC=y
CONFIG_CROS_EC=y
CONFIG_SHIMMED_TASKS=y
CONFIG_PLATFORM_EC_HOOKS=y
CONFIG_EMUL=y

CONFIG_I2C=y
CONFIG_I2C_TARGET=y

CONFIG_PLATFORM_EC_BATTERY=y
CONFIG_PLATFORM_EC_BATTERY_SMART=y
CONFIG_PLATFORM_EC_BATTERY_STATUS_CUSTOM=y
CONFIG_PLATFORM_EC_BATTERY_PRESENT_NONE=y

CONFIG_PLATFORM_EC_USBC=n
CONFIG_PLATFORM_EC_USB_POWER_DELIVERY=n
CONFIG_PLATFORM_EC_CHARGER=n

CONFIG_PLATFORM_EC_CHARGER_SENSE_RESISTOR=10
CONFIG_PLATFORM_EC_CHARGER_SENSE_RESISTOR_AC=10

CONFIG_PLATFORM_EC_ADSP_CHARGE_MANAGER=y

CONFIG_ADSP_COMMS_STACK_SIZE=2048
CONFIG_ADSP_COMMS_MSGQ_SIZE=16
CONFIG_ADSP_COMMS_PRIORITY=5
