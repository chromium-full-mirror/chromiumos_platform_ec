CONFIG_PLATFORM_EC_CMD_BUTTON=y
CONFIG_PLATFORM_EC_CMD_POWERINDEBUG=y
CONFIG_PLATFORM_EC_CONSOLE_CMD_RTC=y
CONFIG_PLATFORM_EC_CONSOLE_CMD_RTC_ALARM=y
CONFIG_PLATFORM_EC_RTC=y
CONFIG_PLATFORM_EC_VOLUME_BUTTONS=y
# The ztest framework runs on the main thread. Since the main thread is occupied
# by the test runner, the host command subsystem cannot run on the main thread
# and is instead allocated to a dedicated thread
# (CONFIG_EC_HOST_CMD_DEDICATED_THREAD) to avoid blocking the execution of tests
CONFIG_TASK_HOSTCMD_THREAD_MAIN=n
CONFIG_PLATFORM_EC_USBC_PPC_DEDICATED_INT=y

CONFIG_SYSTEM_FAKE=y
CONFIG_GPIO_GET_CONFIG=y
CONFIG_PLATFORM_EC_CHARGER_INPUT_CURRENT_DERATE_PCT=0
CONFIG_PLATFORM_EC_CHARGER_SET_FREQUENCY=y
CONFIG_PLATFORM_EC_LOG_CUSTOM_TIMESTAMP=y
CONFIG_PLATFORM_EC_USB_CHARGER=y
