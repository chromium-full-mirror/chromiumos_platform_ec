CONFIG_ZTEST=y
CONFIG_ZTEST_ASSERT_VERBOSE=1
CONFIG_ASSERT=y

CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y

CONFIG_LOG=y

CONFIG_CROS_EC=y
CONFIG_PLATFORM_EC=y
CONFIG_SHIMMED_TASKS=y

CONFIG_AP_PWRSEQ=y
CONFIG_AP_PWRSEQ_DRIVER=y
CONFIG_EMUL_AP_PWRSEQ_DRIVER=y
CONFIG_AP_X86_INTEL_MTL=y

# The CBI model-id accessors are faked by the test
CONFIG_PLATFORM_EC_CBI=n

CONFIG_PLATFORM_EC_LID_SWITCH=n
CONFIG_PLATFORM_EC_SWITCH=n
CONFIG_PLATFORM_EC_BACKLIGHT_LID=n
CONFIG_PLATFORM_EC_VBOOT_HASH=n
CONFIG_PLATFORM_EC_VBOOT_EFS2=n
CONFIG_PLATFORM_EC_VSTORE=n
