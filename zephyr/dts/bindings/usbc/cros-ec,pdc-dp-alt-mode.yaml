description: |
  ChromiumOS PDC DisplayPort Alt-Mode HPD and AUX mux driver.

  This driver registers PDC DP_ATTENTION and UNATTACH callbacks to arbitrate
  DisplayPort Alt-Mode entry across USB-C ports using a first-come,
  first-served (FCFS) policy, driving a single AP HPD GPIO and an optional
  AUX path select GPIO. It should only be used for APs that have a single
  DisplayPort path shared across one or more USB-C ports.

compatible: "cros-ec,pdc-dp-alt-mode"

include: base.yaml

properties:
  hpd-gpios:
    type: phandle-array
    required: true
    description: Output GPIO driving DisplayPort HPD to the AP.

  aux-path-sel-gpios:
    type: phandle-array
    description:
      Optional output GPIO selecting the DisplayPort AUX path between USB-C
      ports (0 for port 0, 1 for port 1).
