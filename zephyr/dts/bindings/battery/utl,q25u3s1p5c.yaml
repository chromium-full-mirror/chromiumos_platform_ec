description: "UTL,Q25U3S1P5C"
compatible: "utl,q25u3s1p5c"

include: battery-smart.yaml

properties:
  enum-name:
    type: string
    default: "utl,q25u3s1p5c"

  # Fuel gauge
  manuf_name:
    default: "UTL"
  device_name:
    default: "Q25U3S1P5C"
  ship_mode_reg_addr:
    default: 0x00
  ship_mode_reg_data:
    default: [0x0010, 0x0010]
  flags:
    default: 0x04
  fet_reg_addr:
    default: 0x0054
  fet_reg_mask:
    default: 0x0002
  fet_disconnect_val:
    default: 0x0000
  fet_cfet_mask:
    default: 0x0004
  fet_cfet_off_val:
    default: 0x0000

  # Battery info
  voltage_max:
    default: 13500
  voltage_normal:
    default: 11730
  voltage_min:
    default: 9000
  precharge_current:
    default: 226
  start_charging_min_c:
    default: 0
  start_charging_max_c:
    default: 45
  charging_min_c:
    default: 0
  charging_max_c:
    default: 60
  discharging_min_c:
    default: -20
  discharging_max_c:
    default: 60
