description: "SWD SWD"
compatible: "swd,swd"

include: battery-smart.yaml

properties:
  enum-name:
    type: string
    default: "swd,swd"

  # Fuel gauge
  manuf_name:
    default: "SWD"
  device_name:
    default: "G82300957"
  ship_mode_reg_addr:
    default: 0x00
  ship_mode_reg_data:
    default: [0x0010, 0x0010]
  flags:
    default: 0x0004
  fet_reg_addr:
    default: 0x54
  fet_reg_mask:
    default: 0x0006
  fet_disconnect_val:
    default: 0x0000
  fet_cfet_mask:
    default: 0x0004
  fet_cfet_off_val:
    default: 0x0000

  # Battery info
  voltage_max:
    default: 9060
  voltage_normal:
    default: 7800
  voltage_min:
    default: 6000
  precharge_current:
    default: 256
  start_charging_min_c:
    default: 0
  start_charging_max_c:
    default: 46
  charging_min_c:
    default: 0
  charging_max_c:
    default: 49
  discharging_min_c:
    default: -20
  discharging_max_c:
    default: 60
