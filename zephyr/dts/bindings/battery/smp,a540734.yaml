description: "SMP battery"
compatible: "smp,a540734"

include: battery-smart.yaml

properties:
  enum-name:
    type: string
    default: "smp,a540734"

  # Fuel gauge
  manuf_name:
    default: "AS3GXXD3KC"
  device_name:
    default: "A540734"
  ship_mode_reg_addr:
    default: 0x00
  ship_mode_reg_data:
    default: [0x0010, 0x0010]
  fet_reg_addr:
    default: 0x99
  fet_reg_mask:
    default: 0x0008
  fet_disconnect_val:
    default: 0x0008
  fet_cfet_mask:
    default: 0x0004
  fet_cfet_off_val:
    default: 0x0004

  # Battery info
  voltage_max:
    default: 18000
  voltage_normal:
    default: 16068
  voltage_min:
    default: 12000
  precharge_current:
    default: 256
  start_charging_min_c:
    default: 0
  start_charging_max_c:
    default: 45
  charging_min_c:
    default: 0
  charging_max_c:
    default: 60
  discharging_min_c:
    default: -20
  discharging_max_c:
    default: 60
