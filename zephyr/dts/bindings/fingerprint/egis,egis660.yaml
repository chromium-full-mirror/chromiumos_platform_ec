description: EGIS660 fingerprint sensor

compatible: "egis,egis660"

include: [spi-device.yaml]

properties:
  irq-gpios:
    type: phandle-array
    required: true
    description: |
      This property specifies the connection for sensor interrupt.

  reset-gpios:
    type: phandle-array
    required: true
    description: |
      This property specifies the connection for sensor reset.

  cover-type:
    type: string
    required: false
    default: "glass"
    enum:
      - "glass"
      - "spray-coating"
    description: |
      The cover type of the fingerprint sensor. Different cover types
      require different private libraries.
