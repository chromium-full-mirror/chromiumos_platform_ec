description: GPIO-based AP power/thermal throttling driver

compatible: "cros-ec,ap-throttle"

include: base.yaml

properties:
  throttle-gpios:
    type: phandle-array
    required: true
    description: |
      GPIO pin connected to the AP throttle / PROCHOT signal (e.g.,
      EC_SYS_THROTTLE_MIRA or EC_SYS_THROTTLE_MIRA_ODL). Active level is
      determined by GPIO_ACTIVE_HIGH / GPIO_ACTIVE_LOW flags.
  ac-only-boot-throttle:
    type: boolean
    description: |
      Keep the throttle signal asserted throughout boot/S0 when booting on AC
      power without a battery present (battery_is_present() != BP_YES).
  g3s5-boot-throttle:
    type: boolean
    description: |
      Assert the AP throttle / PROCHOT signal during the G3 to S5 transition
      (POWER_G3S5) before AP power sequencing commences. This pre-throttles the
      SoC from its initial clock cycles during off-mode charging (e.g., on
      Qualcomm platforms where the AP powers on in S5 to run charging firmware),
      limiting inrush current and preventing VBUS resets or PMIC brownouts.
      The throttle is deasserted once the system transitions to S0 for normal
      OS operation.
